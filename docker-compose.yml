services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-minimum-32-chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "6768:6768"
    volumes:
      - bay_buddy_api_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:6768/api/v1
        INTERNAL_API_BASE_URL: http://api:6768/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:6768/api/v1
      INTERNAL_API_BASE_URL: http://api:6768/api/v1
    depends_on:
      - api
    ports:
      - "6769:6769"

volumes:
  bay_buddy_api_data:
