name: Contract Sync Check

on:
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/contract-sync-check.yml"
  workflow_dispatch:

jobs:
  validate-contract:
    name: Validate OpenAPI -> Web types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.1.3"

      - name: Install API dependencies
        run: poetry install --only main --no-interaction --no-ansi
        working-directory: ./api

      - name: Export OpenAPI schema
        run: poetry run python scripts/export_openapi.py
        working-directory: ./api

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/yarn.lock

      - name: Install Web dependencies
        run: yarn install --frozen-lockfile
        working-directory: ./web

      - name: Generate API types
        run: yarn generate:api-client
        working-directory: ./web
        env:
          OPENAPI_SCHEMA_URL: ../api/openapi/openapi.json

      - name: Build Web
        run: yarn build
        working-directory: ./web
