name: Deploy API to Railway

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-api-railway.yml"
  workflow_dispatch:

concurrency:
  group: railway-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy api
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: cb572f2b-bd81-45b9-8867-9977e9a285e6
      RAILWAY_SERVICE: api
      RAILWAY_ENVIRONMENT: production
      API_HEALTH_URL: https://api-production-6f0e.up.railway.app/health
      API_TICKET_IMPORTS_URL: https://api-production-6f0e.up.railway.app/api/v1/ticket-imports?limit=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway token
        run: test -n "$RAILWAY_TOKEN"

      - name: Deploy API service
        run: >
          railway up api
          --path-as-root
          --project "$RAILWAY_PROJECT_ID"
          --service "$RAILWAY_SERVICE"
          --environment "$RAILWAY_ENVIRONMENT"
          --ci

      - name: Verify API health
        run: curl -fsSL "$API_HEALTH_URL"

      - name: Verify ticket imports contract
        run: |
          status="$(curl -sS -o /tmp/ticket-imports-response.txt -w "%{http_code}" -L "$API_TICKET_IMPORTS_URL")"
          if [ "$status" != "401" ]; then
            echo "Expected ticket imports endpoint to exist and require auth, got HTTP $status"
            cat /tmp/ticket-imports-response.txt
            exit 1
          fi
