# alembic.ini – Alembic configuration for Bay Buddy API.
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts directory.
script_location = migrations

# Template for new migration file names.
# %(rev)s = revision id, %(slug)s = short description
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with this comma-separated list so `env.py` can import
# the application modules (models, database).
prepend_sys_path = .

# Timezone used when generating migration timestamps.
timezone = UTC

# ---------------------------------------------------------------------------
# Database URL
# Alembic reads this only when NOT overridden by env.py (which prefers the
# DATABASE_URL environment variable set in .env).
# ---------------------------------------------------------------------------
sqlalchemy.url = sqlite:///./bay_buddy.db

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
